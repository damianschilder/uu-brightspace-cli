[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uu-cli"
version = "0.1.0"
description = "Headless command-line access to Utrecht University platforms (Brightspace, Konjoin), built on Playwright"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jakob von Gehlen" }]
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40,<2",
    "pyotp>=2.9,<3",
    "requests>=2.31,<3",
    "cryptography>=42,<47",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
uu = "uu_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: drives Playwright's Chromium against an offline fake (skipped when Chromium is missing)"]
